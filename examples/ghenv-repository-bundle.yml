name: ghenv repository development bundle
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [Preview]
        default: Preview
        required: true
      request_id:
        description: Generated by the local ghenv CLI
        required: true
      public_key:
        description: Ephemeral public key generated by the local ghenv CLI
        required: true
      secret_names:
        default: ''
      variable_names:
        default: ''
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Replace FULL_ACTION_COMMIT_SHA with a reviewed 40-character commit.
      - uses: nicodes/ghenv-actions@FULL_ACTION_COMMIT_SHA
        with:
          environment: ${{ inputs.environment }}
          preview-bundle: ${{ secrets.GHENV_PREVIEW_BUNDLE }}
          request-id: ${{ inputs.request_id }}
          public-key: ${{ inputs.public_key }}
          secret-names: ${{ inputs.secret_names }}
          variable-names: ${{ inputs.variable_names }}
