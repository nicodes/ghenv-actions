name: ghenv Preview handoff
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [Preview]
        default: Preview
        required: true
      request_id:
        description: Generated by the local ghenv CLI
        required: true
      public_key:
        description: Ephemeral public key generated by the local ghenv CLI
        required: true
      secret_names:
        default: ''
      variable_names:
        default: ''
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Preview
    steps:
      # Replace FULL_ACTION_COMMIT_SHA with a reviewed 40-character commit.
      - uses: nicodes/ghenv-actions@FULL_ACTION_COMMIT_SHA
        with:
          environment: ${{ inputs.environment }}
          preview-bundle: >-
            ${{ format('{{"version":1,"environment":"Preview","repository":{0},"secrets":{{"API_KEY":{1}}},"variables":{{"PUBLIC_KEY":{2}}}}}', toJSON(github.repository), toJSON(secrets.API_KEY), toJSON(vars.PUBLIC_KEY)) }}
          request-id: ${{ inputs.request_id }}
          public-key: ${{ inputs.public_key }}
          secret-names: ${{ inputs.secret_names }}
          variable-names: ${{ inputs.variable_names }}
