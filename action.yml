name: ghenv Preview handoff
description: Encrypt approved Preview bundle entries for a local ghenv process
inputs:
  environment:
    description: Must be Preview; caller selects the approved Preview credential source
    default: Preview
  preview-bundle:
    description: Owner-curated GHENV_PREVIEW_BUNDLE secret for the calling repository
    required: true
  public-key:
    description: Base64 DER ephemeral RSA public key generated by the local CLI
    required: true
  request-id:
    description: 32 lowercase hexadecimal characters generated by the local CLI
    required: true
  secret-names:
    description: Comma-separated names selected from the bundle secrets map
    default: ''
  variable-names:
    description: Comma-separated names selected from the bundle variables map
    default: ''
outputs:
  artifact-id:
    description: ID of the ciphertext artifact
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: URL of the ciphertext artifact
    value: ${{ steps.upload.outputs.artifact-url }}
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.27.3'
        cache: false
    - name: Build pinned exporter before exposing the bundle
      id: prepare
      shell: bash
      env:
        GHENV_ACTION_PATH: ${{ github.action_path }}
        GHENV_ENVIRONMENT: ${{ inputs.environment }}
        GHENV_REQUEST_ID: ${{ inputs.request-id }}
        GHENV_PUBLIC_KEY: ${{ inputs.public-key }}
      run: bash "$GHENV_ACTION_PATH/scripts/prepare.sh"
    - name: Validate bundle and encrypt selected entries
      shell: bash
      env:
        GHENV_STATE_DIR: ${{ steps.prepare.outputs.state-dir }}
        GHENV_PREVIEW_BUNDLE: ${{ inputs.preview-bundle }}
        GHENV_SECRET_NAMES: ${{ inputs.secret-names }}
        GHENV_VAR_NAMES: ${{ inputs.variable-names }}
        GHENV_PUBLIC_KEY: ${{ inputs.public-key }}
        GHENV_REQUEST_ID: ${{ inputs.request-id }}
      run: |
        umask 077
        "$GHENV_STATE_DIR/bin/ghenv" seal > "$GHENV_STATE_DIR/payload.json"
    - name: Upload ciphertext
      id: upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ghenv-${{ inputs.request-id }}
        path: ${{ steps.prepare.outputs.state-dir }}/payload.json
        retention-days: 1
        if-no-files-found: error
    - name: Remove temporary exporter and ciphertext
      if: always()
      shell: bash
      env:
        GHENV_ACTION_PATH: ${{ github.action_path }}
        GHENV_STATE_DIR: ${{ steps.prepare.outputs.state-dir }}
      run: bash "$GHENV_ACTION_PATH/scripts/cleanup.sh"
branding:
  icon: lock
  color: blue
